services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dropforge
    ports:
      - "5432:5432"
    volumes:
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/dropforge
    depends_on:
      - redis
      - db

  frontend:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: python -m http.server 3000

  worker-default:
    build: ./backend
    # Subscribed ONLY to 'default'. Handles bulk standard processing.
    command: celery -A src.worker.celery_app worker -Q default --concurrency=8 --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/dropforge
    depends_on:
      - redis
      - db

  worker-priority:
    build: ./backend
    # Subscribed ONLY to 'priority'. Dedicated capacity for network retries.
    command: celery -A src.worker.celery_app worker -Q priority --concurrency=2 --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/dropforge
    depends_on:
      - redis
      - db

  beat:
    build: ./backend
    command: celery -A src.worker.celery_app beat --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis