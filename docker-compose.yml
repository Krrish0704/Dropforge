services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://postgres:Thuglife5154%23@database-1.cluster-cha8g0qccmcn.eu-north-1.rds.amazonaws.com:5432/postgres
    depends_on:
      - redis

  frontend:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: python -m http.server 3000

  worker-default:
    build: ./backend
    # Subscribed ONLY to 'default'. Handles bulk standard processing.
    command: celery -A src.worker.celery_app worker -Q default --concurrency=8 --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://postgres:Thuglife5154%23@database-1.cluster-cha8g0qccmcn.eu-north-1.rds.amazonaws.com:5432/postgres
    depends_on:
      - redis

  worker-priority:
    build: ./backend
    # Subscribed ONLY to 'priority'. Dedicated capacity for network retries.
    command: celery -A src.worker.celery_app worker -Q priority --concurrency=2 --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://postgres:Thuglife5154%23@database-1.cluster-cha8g0qccmcn.eu-north-1.rds.amazonaws.com:5432/postgres
    depends_on:
      - redis

  beat:
    build: ./backend
    command: celery -A src.worker.celery_app beat --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis